
user  nginx;
worker_processes  4;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

worker_rlimit_nofile 65535;

events {
    worker_connections  5000;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

#    log_format  main  '$http_x_forwarded_for - $remote_user [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" '
#                      '"$http_user_agent"';

    log_format main '$host:$server_port $http_x_forwarded_for - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent"';

#    access_log  /var/log/nginx/access.log;
    access_log  /var/log/nginx/access.log  main;
#    access_log off;

    sendfile        on;
    #tcp_nopush     on;
    # keep in sync with max-request-size in src/main/webapp/WEB-INF/web.xml (30000000)
    client_max_body_size 30m;

    keepalive_timeout  30m;

    # --- TLS: inherited by the 443 and 9000 servers ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDH+AESGCM:ECDH+AES256:ECDH+AES128:ECDH+CHACHA20:!ADH:!AECDH:!MD5:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 30m;

    server_tokens off;

    gzip on;
    gzip_types text/xml text/plain text/css text/javascript application/javascript
               application/rss+xml application/json image/svg+xml;
    gzip_proxied any;
    gzip_vary on;

    #include /etc/nginx/conf.d/*.conf;

    upstream tomcat {
       server 127.0.0.1:8080;
       keepalive 64;
    }

    upstream tomcat_secure {
       server 127.0.0.1:8444;
       keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        server_name  linux.org.ru www.linux.org.ru _;

        root         /usr/share/nginx/html;

        #charset koi8-r;

        #access_log  /var/log/nginx/host.access.log  main;

        location / {
            proxy_pass    http://tomcat;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Host       $host;
            proxy_http_version 1.1;
            proxy_buffering on;
            proxy_read_timeout 30m;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen       443 ssl;
        #server_name  linux.org.ru _;
        root         /usr/share/nginx/html;

        ssl_certificate     /etc/nginx/le-certs.pem;
        ssl_certificate_key /etc/nginx/le-key.pem;

        #charset koi8-r;

        #access_log  /var/log/nginx/host.access.log  main;

        location /.well-known {
            alias /usr/share/nginx/html/.well-known;
        }

        location / {
            proxy_pass    http://tomcat_secure;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host       $host;
            proxy_http_version 1.1;
            proxy_buffering on;
            proxy_read_timeout 30m;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen       9000 ssl;
        #server_name  localhost;
        root         /usr/share/nginx/html;

        ssl_certificate     /etc/nginx/le-certs.pem;
        ssl_certificate_key /etc/nginx/le-key.pem;

        #charset koi8-r;

        #access_log  /var/log/nginx/host.access.log  main;

        location /ws {
            proxy_pass    http://tomcat_secure;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host       $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 30m;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
