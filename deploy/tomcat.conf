# Environment file loaded by systemd (EnvironmentFile= in tomcat-opt.service).

# Which java installation to use
JAVA_HOME="/usr/lib/jvm/jre"

# Where your tomcat installation lives
CATALINA_HOME="/opt/tomcat"

# System-wide tmp
CATALINA_TMPDIR="/var/cache/tomcat/temp"

# JVM options; compact object headers require G1 (default GC)
JAVA_OPTS="-XX:+UseCompactObjectHeaders"
